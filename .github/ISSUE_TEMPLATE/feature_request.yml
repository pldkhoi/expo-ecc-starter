name: Feature request
description: Suggest an enhancement or new feature.
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are you trying to solve?
      placeholder: As a developer, I want to ... so that ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add a `useDeepLink` hook that parses the inbound URL and validates the path against an allowlist...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: We considered `Linking.addEventListener` directly but it does not validate paths...

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I have searched existing issues and discussions.
          required: true
        - label: This is not a security report (use SECURITY.md if so).
          required: true
